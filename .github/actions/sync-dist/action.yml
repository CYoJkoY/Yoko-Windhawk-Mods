name: Sync dist bundles
description: >-
  Mirror *.wh.cpp from this repository into the mods directory of the
  target repository, committing only when the file contents differ.

inputs:
  source-root:
    description: Absolute path of the source checkout
    required: true
  target-root:
    description: Absolute path of the target checkout
    required: true
  target-branch:
    description: Branch of the target repository to push to
    required: true
  file-glob:
    description: Glob of bundle files to mirror
    required: false
    default: '*.wh.cpp'
  prune:
    description: Delete target bundles that no longer exist in dist
    required: false
    default: 'false'
  dry-run:
    description: Report pending files without committing or pushing
    required: false
    default: 'false'

outputs:
  changed:
    description: '"true" when the target needed updates'
    value: ${{ steps.diff.outputs.changed }}
  pushed:
    description: '"true" when a commit was pushed to the target'
    value: ${{ steps.mirror.outputs.pushed || 'false' }}

runs:
  using: composite
  steps:
    - name: Detect target differences
      id: diff
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TARGET_ROOT: ${{ inputs.target-root }}
        FILE_GLOB: ${{ inputs.file-glob }}
        PRUNE: ${{ inputs.prune }}
      run: |
        set -euo pipefail

        # 优先检测 source-root/dist，不存在则回退至 source-root 根目录
        if [ -d "$SOURCE_ROOT/dist" ]; then
          SRC_MODS="$SOURCE_ROOT/dist"
        elif [ -d "$SOURCE_ROOT" ]; then
          SRC_MODS="$SOURCE_ROOT"
        else
          echo "::error::source path not found: $SOURCE_ROOT"
          exit 1
        fi

        DST_MODS="$TARGET_ROOT/mods"
        GLOB="$FILE_GLOB"

        changed=0
        pending=()

        while IFS= read -r -d '' f; do
          rel="${f#"$SRC_MODS"/}"
          if [ ! -f "$DST_MODS/$rel" ] || ! cmp -s "$f" "$DST_MODS/$rel"; then
            pending+=("$rel")
            changed=1
          fi
        done < <(find "$SRC_MODS" -maxdepth 1 -type f -name "$GLOB" -print0)

        if [ "${PRUNE:-false}" = "true" ] && [ -d "$DST_MODS" ]; then
          while IFS= read -r -d '' f; do
            rel="${f#"$DST_MODS"/}"
            if [ ! -f "$SRC_MODS/$rel" ]; then
              pending+=("$rel")
              changed=1
            fi
          done < <(find "$DST_MODS" -maxdepth 1 -type f -name "$GLOB" -print0)
        fi

        if [ "$changed" -eq 0 ]; then
          {
            echo "### Sync gate"
            echo ""
            echo "- No differences between source bundles and \`target/mods\`."
            echo "- Sync skipped; the target is already current."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        {
          echo "### Sync gate"
          echo ""
          echo "- Pending files: ${#pending[@]}"
          for x in "${pending[@]}"; do echo "- pending: $x"; done
        } >> "$GITHUB_STEP_SUMMARY"
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Mirror dist to target mods
      id: mirror
      if: steps.diff.outputs.changed == 'true'
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
        TARGET_ROOT: ${{ inputs.target-root }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        FILE_GLOB: ${{ inputs.file-glob }}
        PRUNE: ${{ inputs.prune }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        # 优先检测 source-root/dist，不存在则回退至 source-root 根目录
        if [ -d "$SOURCE_ROOT/dist" ]; then
          SRC_MODS="$SOURCE_ROOT/dist"
        elif [ -d "$SOURCE_ROOT" ]; then
          SRC_MODS="$SOURCE_ROOT"
        else
          echo "::error::source path not found: $SOURCE_ROOT"
          exit 1
        fi

        DST_MODS="$TARGET_ROOT/mods"
        GLOB="$FILE_GLOB"
        mkdir -p "$DST_MODS"

        added=(); updated=(); removed=()

        # 1) 拷贝新增与变动文件
        while IFS= read -r -d '' f; do
          rel="${f#"$SRC_MODS"/}"
          dst="$DST_MODS/$rel"
          mkdir -p "$(dirname "$dst")"
          if [ ! -f "$dst" ]; then
            cp "$f" "$dst"; added+=("$rel")
          elif ! cmp -s "$f" "$dst"; then
            cp "$f" "$dst"; updated+=("$rel")
          fi
        done < <(find "$SRC_MODS" -maxdepth 1 -type f -name "$GLOB" -print0)

        # 2) 按需删除目标中已废弃的文件
        if [ "${PRUNE:-false}" = "true" ] && [ -d "$DST_MODS" ]; then
          while IFS= read -r -d '' f; do
            rel="${f#"$DST_MODS"/}"
            if [ ! -f "$SRC_MODS/$rel" ]; then
              rm -f "$f"
              removed+=("$rel")
            fi
          done < <(find "$DST_MODS" -maxdepth 1 -type f -name "$GLOB" -print0)
        fi

        # 3) 获取提交信息（兼容非 Git 目录的极端兜底）
        if git -C "$SOURCE_ROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          SRC_SHA="$(git -C "$SOURCE_ROOT" rev-parse --short HEAD)"
          SRC_MSG="$(git -C "$SOURCE_ROOT" log -1 --pretty=%s)"
          MSG="sync(mods): $SRC_MSG (Yoko@$SRC_SHA)"
        else
          MSG="sync(mods): update mod bundles from latest release"
          SRC_SHA="unknown"
          SRC_MSG="update bundles"
        fi

        {
          echo "### Sync summary"
          echo ""
          echo "- target branch: \`$TARGET_BRANCH\`"
          echo "- source commit: \`$SRC_SHA\` $SRC_MSG"
          echo "- added: ${#added[@]} / updated: ${#updated[@]} / removed: ${#removed[@]}"
          echo ""
          for x in "${added[@]}"; do echo "- \`+\` $x"; done
          for x in "${updated[@]}"; do echo "- \`~\` $x"; done
          for x in "${removed[@]}"; do echo "- \`-\` $x"; done
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${DRY_RUN:-false}" = "true" ]; then
          echo "dry_run=true, skip commit and push"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        cd "$TARGET_ROOT"

        git add -A mods

        if git diff --cached --quiet; then
          echo "No mods changes, nothing to push."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "$MSG"

        pushed=0
        for attempt in 1 2 3 4 5; do
          if [ "$attempt" -gt 1 ]; then
            echo "Attempt $attempt: pulling remote changes with rebase..."
            git pull --rebase --autostash origin "$TARGET_BRANCH" || true
          fi
          if git push origin "HEAD:$TARGET_BRANCH"; then
            pushed=1
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            break
          fi
          echo "attempt $attempt failed, retrying..."
          sleep $((attempt * 5))
        done

        if [ "$pushed" -ne 1 ]; then
          echo "::error::push failed after 5 attempts"
          exit 1
        fi
