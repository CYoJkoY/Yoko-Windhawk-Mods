name: Compile one mod
description: >-
  Install each requested Windhawk version, check the bundle metadata, compile
  the bundle for x86, x64, and ARM64, and collect the resulting DLLs. The
  action touches one bundle only, so a failure stays inside a single mod.

inputs:
  mod-id:
    description: Mod id that owns the bundle and the artifact names
    required: true
  versions:
    description: Space or comma separated exact Windhawk releases
    required: true
  bundle:
    description: Path of the <mod-id>.wh.cpp bundle to compile
    required: true
  dll-dir:
    description: Directory that receives one <version>/ subdirectory of DLLs
    required: true

outputs:
  windhawk-roots:
    description: One `<version>=<path>` line per portable Windhawk tree
    value: ${{ steps.compile.outputs.windhawk-roots }}

runs:
  using: composite
  steps:
    - name: Compile mod with every Windhawk version
      id: compile
      shell: bash
      env:
        WINHAWK_VERSIONS: ${{ inputs.versions }}
        BUNDLE: ${{ inputs.bundle }}
        MOD_ID: ${{ inputs.mod-id }}
        DLL_DIR: ${{ inputs.dll-dir }}
      run: |
        set -euo pipefail
        versions="${WINHAWK_VERSIONS//,/ }"
        if [ -z "${versions// /}" ]; then
          echo "::error::at least one Windhawk version is required"
          exit 1
        fi
        name="$(basename "$BUNDLE" .wh.cpp)"
        if [[ "$name" != "$MOD_ID" ]]; then
          echo "::error::bundle $BUNDLE does not belong to mod $MOD_ID"
          exit 1
        fi
        if [[ ! -f "$BUNDLE" ]]; then
          echo "::error::bundle not found: $BUNDLE"
          exit 1
        fi
        roots=''

        for version in $versions; do
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::invalid Windhawk version: $version"
            exit 1
          fi
          echo "::group::Windhawk $version"
          if [[ "$version" == 1.* ]]; then
            installer_args=''
          else
            installer_args='/DEVTOOLS'
          fi

          installer_path="${RUNNER_TEMP}/windhawk_setup_${version}.exe"
          tag_with_v="v${version#v}"
          tag_without_v="${version#v}"

          # Accept release tags with or without the leading "v".
          installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_with_v}/windhawk_setup.exe"
          echo "Downloading $installer_url"
          if ! curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path" 2>/dev/null; then
            installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_without_v}/windhawk_setup.exe"
            echo "Retrying download with $installer_url"
            curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path"
          fi

          extract_posix="${RUNNER_TEMP//\\//}/windhawk-${version}"
          extract_win="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          echo "Extracting to $extract_win"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE $installer_args "/D=$extract_win"

          ready=0
          for _ in $(seq 1 150); do
            if [[ -f "$extract_posix/windhawk.exe" ]] &&
               [[ -f "$extract_posix/windhawk.ini" ]] &&
               [[ -f "$extract_posix/Compiler/bin/clang++.exe" ]] &&
               [[ -n "$(find "$extract_posix/Engine" -name windhawk.lib -print -quit 2>/dev/null || true)" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Windhawk $version portable extraction did not complete"
            find "$extract_posix" -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          echo "Windhawk $version portable tree is ready"

          windhawk_path="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          out_dir="$DLL_DIR/$version"
          mkdir -p "$out_dir"

          if [[ "$version" != 1.* ]]; then
            echo "Checking metadata of $BUNDLE"
            MSYS_NO_PATHCONV=1 "$extract_posix/windhawk-cli.exe" \
              --app-root "$windhawk_path" source meta --strict "$BUNDLE" --json
          fi

          if [[ "$version" == 1.* ]]; then
            compiler_script="${RUNNER_TEMP//\\//}/compile_mod.py"
            compiler_script_url="https://raw.githubusercontent.com/ramensoftware/windhawk-mods/c121075aeb9dcc8e133423192cc9fdfb9e606ff5/scripts/compile_mod.py"
            curl --fail --location --retry 3 --retry-delay 1 "$compiler_script_url" -o "$compiler_script"
            echo "Compiling $BUNDLE with Windhawk $version"
            python -u "$compiler_script" -w "$windhawk_path" \
              -f "$BUNDLE" \
              -o32 "${out_dir}/${name}_32.dll" \
              -o64 "${out_dir}/${name}_64.dll" \
              -oarm64 "${out_dir}/${name}_arm64.dll"
          else
            cli="$extract_posix/windhawk-cli.exe"
            result="${RUNNER_TEMP//\\//}/${name}_compile_${version}.json"
            echo "Compiling $BUNDLE with Windhawk $version"
            if ! MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" --json \
              mod install --disabled --arch all --file "$BUNDLE" > "$result"; then
              jq -r '"::error::\(.error.code): \(.error.message)"' "$result" || cat "$result"
              exit 1
            fi
            if jq -e '(.data.warnings // []) | length > 0' "$result" > /dev/null; then
              cat "$result"
              echo "::error::$BUNDLE compiled with warnings"
              exit 1
            fi
            for arch in 32 64 arm64; do
              mod_dir="$extract_posix/AppData/Engine/Mods/$arch"
              candidates=()
              while IFS= read -r candidate; do
                candidates+=("$candidate")
              done < <(find "$mod_dir" -maxdepth 1 -type f -name "local@${name}_*.dll" -print 2>/dev/null || true)
              if [[ "${#candidates[@]}" -ne 1 ]]; then
                echo "::error::expected one $arch build for $name, found ${#candidates[@]}"
                find "$mod_dir" -maxdepth 1 -type f -print 2>/dev/null || true
                exit 1
              fi
              cp "${candidates[0]}" "$out_dir/${name}_${arch}.dll"
            done
          fi

          for arch in 32 64 arm64; do
            if [[ ! -f "$out_dir/${name}_${arch}.dll" ]]; then
              echo "::error::missing $arch build for $name at $out_dir"
              exit 1
            fi
          done
          find "$out_dir" -type f -print | sort
          roots="${roots}${version}=${extract_posix}"$'\n'
          echo "::endgroup::"
        done

        {
          echo "windhawk-roots<<ROOTS"
          printf '%s' "$roots"
          echo "ROOTS"
        } >> "$GITHUB_OUTPUT"
