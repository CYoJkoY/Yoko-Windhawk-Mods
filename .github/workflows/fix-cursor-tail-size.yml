name: Fix Cursor Tail SIZE compile error

on:
  push:
    branches:
      - fix/cursor-tail-update-layered-window
    paths:
      - '.github/workflows/fix-cursor-tail-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Apply compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mods/cursor-tail.wh.cpp')
          text = path.read_text(encoding='utf-8')
          old = '    POINT pos = {bounds.left, bounds.top}; const SIZE size = {width, height}; POINT source = {0, 0};\n'
          new = '    POINT pos = {bounds.left, bounds.top}; SIZE size = {width, height}; POINT source = {0, 0};\n'
          if text.count(old) != 1:
              raise SystemExit('Expected UpdateLayeredWindow declarations were not found exactly once.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

          grep -n "UpdateLayeredWindow(hwnd" mods/cursor-tail.wh.cpp
          grep -n "POINT pos\|SIZE size\|POINT source" mods/cursor-tail.wh.cpp
          if grep -n "const POINT pos\|const SIZE size\|const POINT source" mods/cursor-tail.wh.cpp; then
            echo 'ERROR: const UpdateLayeredWindow arguments remain.'
            exit 1
          fi
          git diff --check

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/cursor-tail.wh.cpp
          git rm .github/workflows/fix-cursor-tail-size.yml
          git commit -m 'fix: pass mutable SIZE to UpdateLayeredWindow'
          git push origin HEAD:fix/cursor-tail-update-layered-window
