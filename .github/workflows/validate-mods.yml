name: Validate mods

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mods:
        description: 'Mod ids to publish, space or comma separated; empty publishes every mod'
        type: string
        default: ''
      open-prs:
        description: 'Open or refresh the upstream pull requests'
        type: boolean
        default: false
      dry-run:
        description: 'Report the pending branches without pushing them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  TARGET_REPO: CYoJkoY/windhawk-mods
  UPSTREAM_REPO: ramensoftware/windhawk-mods
  BRANCH_PREFIX: 'mods/'
  BASE_BRANCH: main

jobs:
  bundle:
    name: Bundle and test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate mod bundles
        run: python tools/bundle.py

      - name: Run bundler tests
        run: python -m unittest discover -s tools/tests -t . -v

      - name: Report bundle statistics
        run: python tools/bundle.py --json

      - name: Upload bundled mods
        uses: actions/upload-artifact@v4
        with:
          name: mod-bundles
          path: dist/*.wh.cpp
          if-no-files-found: error
          retention-days: 14

  compile:
    name: Compile with Windhawk ${{ matrix.version }}
    runs-on: windows-latest
    needs: bundle
    timeout-minutes: 45
    env:
      WINHAWK_VERSION: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.7.3'
          - '2.0.0-alpha.8'
    steps:
      - name: Checkout native regression sources
        uses: actions/checkout@v4

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Windhawk
        run: |
          set -euo pipefail
          raw_version="${{ matrix.version }}"
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            installer_args=''
          else
            installer_args='/DEVTOOLS'
          fi

          installer_path="${RUNNER_TEMP}/windhawk_setup.exe"
          tag_with_v="v${raw_version#v}"
          tag_without_v="${raw_version#v}"

          # Accept release tags with or without the leading "v".
          installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_with_v}/windhawk_setup.exe"
          echo "Downloading $installer_url"
          if ! curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path" 2>/dev/null; then
            installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_without_v}/windhawk_setup.exe"
            echo "Retrying download with $installer_url"
            curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path"
          fi

          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          extract_win="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          echo "Extracting to $extract_win"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE $installer_args "/D=$extract_win"

          ready=0
          for _ in $(seq 1 150); do
            if [[ -f "$extract_posix/windhawk.exe" ]] &&
               [[ -f "$extract_posix/windhawk.ini" ]] &&
               [[ -f "$extract_posix/Compiler/bin/clang++.exe" ]] &&
               [[ -n "$(find "$extract_posix/Engine" -name windhawk.lib -print -quit 2>/dev/null || true)" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Windhawk portable extraction did not complete"
            find "$extract_posix" -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          echo "Windhawk portable tree is ready"

      - name: Run native canvas regressions
        run: |
          set -euo pipefail
          export WINDHAWK_ROOT="${RUNNER_TEMP//\\//}/windhawk"
          python -m unittest tools.tests.test_aleph_canvas_native -v

      - name: Check metadata
        if: startsWith(matrix.version, '2.')
        run: |
          set -euo pipefail
          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          windhawk_path="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          cli="$extract_posix/windhawk-cli.exe"
          while IFS= read -r file; do
            echo "Checking metadata of $file"
            MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" source meta --strict "$file" --json
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

      - name: Compile bundles
        run: |
          set -euo pipefail
          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          windhawk_path="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            compiler_script="${RUNNER_TEMP//\\//}/compile_mod.py"
            compiler_script_url="https://raw.githubusercontent.com/ramensoftware/windhawk-mods/c121075aeb9dcc8e133423192cc9fdfb9e606ff5/scripts/compile_mod.py"
            curl --fail --location --retry 3 --retry-delay 1 "$compiler_script_url" -o "$compiler_script"
          else
            cli="$extract_posix/windhawk-cli.exe"
          fi

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            echo "Compiling $file"
            if [[ "$WINHAWK_VERSION" == 1.* ]]; then
              python -u "$compiler_script" -w "$windhawk_path" \
                -f "$file" \
                -o32 "${RUNNER_TEMP//\\//}/${name}_32.dll" \
                -o64 "${RUNNER_TEMP//\\//}/${name}_64.dll" \
                -oarm64 "${RUNNER_TEMP//\\//}/${name}_arm64.dll"
            else
              result="${RUNNER_TEMP//\\//}/${name}_compile.json"
              if ! MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" --json \
                mod install --disabled --arch all --file "$file" > "$result"; then
                jq -r '"::error::\(.error.code): \(.error.message)"' "$result" || cat "$result"
                exit 1
              fi
              if jq -e '(.data.warnings // []) | length > 0' "$result" > /dev/null; then
                cat "$result"
                echo "::error::$file compiled with warnings"
                exit 1
              fi
            fi
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

      - name: Collect compiled DLLs
        run: |
          set -euo pipefail
          wh_root="${RUNNER_TEMP//\\//}/windhawk"
          out_dir="${RUNNER_TEMP//\\//}/dlls"
          mkdir -p "$out_dir"

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            for arch in 32 64 arm64; do
              if [[ "$WINHAWK_VERSION" == 1.* ]]; then
                src="${RUNNER_TEMP//\\//}/${name}_${arch}.dll"
              else
                mod_dir="$wh_root/AppData/Engine/Mods/$arch"
                candidates=()
                while IFS= read -r candidate; do
                  candidates+=("$candidate")
                done < <(find "$mod_dir" -maxdepth 1 -type f -name "local@${name}_*.dll" -print 2>/dev/null || true)
                if [[ "${#candidates[@]}" -ne 1 ]]; then
                  echo "::error::expected one $arch build for $name, found ${#candidates[@]}"
                  find "$mod_dir" -maxdepth 1 -type f -print 2>/dev/null || true
                  exit 1
                fi
                src="${candidates[0]}"
              fi
              if [[ ! -f "$src" ]]; then
                echo "::error::missing $arch build for $name at $src"
                exit 1
              fi
              cp "$src" "$out_dir/${name}_${arch}.dll"
            done
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

          find "$out_dir" -type f -print | sort

      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windhawk-${{ matrix.version }}-dlls
          path: ${{ runner.temp }}/dlls/*.dll
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Deploy bundles to release branch
    runs-on: ubuntu-latest
    needs: [bundle, compile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: ${{ runner.temp }}/mod-bundles

      - name: Publish release snapshot
        uses: ./.github/actions/publish-release
        with:
          bundle-dir: ${{ runner.temp }}/mod-bundles
          validated-sha: ${{ github.sha }}
          branch: release

  select:
    name: Select changed mods
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 5
    outputs:
      mods: ${{ steps.select.outputs.mods }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A push that only touches mods/<id>/ republishes that mod. A bundle-wide
      # input republishes every mod because it can change any bundle.
      - name: Map changed paths to mods
        id: select
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$paths"
          extra=()
          if [ "$FORCE_ALL" = "true" ]; then
            echo "Manual run; every mod is republished."
            extra=(--all)
          elif [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]] ||
            ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; every mod is republished."
            extra=(--all)
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$paths"
            echo "Changed paths:"
            cat "$paths"
          fi
          python tools/changed_mods.py --paths "$paths" \
            --trigger shared \
            --trigger tools/bundle.py \
            --github-output "$GITHUB_OUTPUT" \
            ${extra[@]+"${extra[@]}"}

  publish-mods:
    name: Publish per-mod branches
    runs-on: ubuntu-latest
    needs: [bundle, compile, select]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.select.outputs.count != '' &&
      needs.select.outputs.count != '0'
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: publish-mod-branches
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: ${{ runner.temp }}/mod-bundles

      - name: Publish mod branches and pull requests
        uses: ./.github/actions/publish-mod-branches
        with:
          bundle-dir: ${{ runner.temp }}/mod-bundles
          target-repo: ${{ env.TARGET_REPO }}
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          branch-prefix: ${{ env.BRANCH_PREFIX }}
          base-branch: ${{ env.BASE_BRANCH }}
          mods: ${{ github.event_name == 'workflow_dispatch' && inputs.mods || needs.select.outputs.mods }}
          open-prs: ${{ github.event_name != 'workflow_dispatch' || inputs.open-prs }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
          changelog: ${{ github.event.head_commit.message }}
