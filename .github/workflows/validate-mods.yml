name: Validate mods

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests may cancel older runs; main pushes must finish so a pending
  # dist publish is never interrupted.
  group: validate-mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'

jobs:
  bundle:
    name: Bundle and test
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      regenerated: ${{ steps.compare.outputs.regenerated }}
      dist_changed: ${{ steps.compare.outputs.dist_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The comparison needs the previous commit to decide whether this
          # push itself touched dist/.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Regenerate bundles
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          author="$(git log -1 --pretty=%an)"
          subject="$(git log -1 --pretty=%s)"
          if [ "$author" = "github-actions[bot]" ] && [[ "$subject" == chore\(dist\):* ]]; then
            # A published dist commit has to stay reproducible. If the bundler
            # no longer produces it, fail instead of publishing forever.
            python tools/bundle.py --check
          else
            python tools/bundle.py
          fi
      - name: Verify dist is current
        if: github.event_name != 'push'
        run: python tools/bundle.py --check
      - name: Run bundler tests
        run: python -m unittest discover -s tools/tests -t . -v
      - name: Report bundle statistics
        run: python tools/bundle.py --json
      - name: Compare regenerated bundles
        id: compare
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          regenerated=false
          dist_changed=false

          # Porcelain output also catches bundles that the sources added, which
          # a plain git diff would report as untracked.
          if [ -n "$(git status --porcelain -- dist)" ]; then
            regenerated=true
            dist_changed=true
          fi

          base="${BASE_SHA:-}"
          if [ -z "$base" ] ||
             [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A new branch or rewritten history makes dist new content.
            dist_changed=true
          elif ! git diff --quiet "$base" HEAD -- dist; then
            dist_changed=true
          fi

          echo "regenerated=$regenerated" >> "$GITHUB_OUTPUT"
          echo "dist_changed=$dist_changed" >> "$GITHUB_OUTPUT"

          {
            echo "### Bundle comparison"
            echo ""
            if [ "$regenerated" = "true" ]; then
              echo "Regenerated bundles differ from the committed files:"
              echo '```'
              git status --porcelain -- dist
              echo '```'
            else
              echo "Regenerated bundles match \`dist/\`; no commit is published."
            fi
            if [ "$dist_changed" = "true" ]; then
              echo ""
              echo "This push changes \`dist/\`; the target mirror is checked."
            else
              echo ""
              echo "This push leaves \`dist/\` untouched; the sync job is skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundled mods
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mod-bundles
          path: dist/*.wh.cpp
          if-no-files-found: error
          retention-days: 14

  compile:
    name: Compile with Windhawk ${{ matrix.version }}
    runs-on: windows-latest
    needs: bundle
    timeout-minutes: 45
    env:
      WINHAWK_VERSION: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.7.3'
          - '2.0.0-alpha.8'
    steps:
      # The artifact holds the bundles regenerated by the bundle job. Compiling
      # it instead of the checkout makes a published dist the exact content
      # that was validated.
      - name: Download bundled mods
        uses: actions/download-artifact@v8.0.2
        with:
          name: mod-bundles
          path: dist
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Extract Windhawk
        run: |
          set -euo pipefail
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            release_tag="v${{ matrix.version }}"
            installer_args=''
          else
            # Starting with 2.0.0-alpha.1 the release tag has no "v" prefix,
            # and /DEVTOOLS pulls the compiler into the portable install.
            release_tag="${{ matrix.version }}"
            installer_args='/DEVTOOLS'
          fi

          installer_url="https://github.com/ramensoftware/windhawk/releases/download/$release_tag/windhawk_setup.exe"
          installer_path="${{ runner.temp }}/windhawk_setup.exe"
          echo "Downloading $installer_url"
          curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path"

          extract_win="${{ runner.temp }}\\windhawk"
          extract_posix="${{ runner.temp }}/windhawk"
          echo "Extracting to $extract_win"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE $installer_args "/D=$extract_win"

          # The portable installer returns before the tree is fully unpacked.
          ready=0
          for _ in $(seq 1 150); do
            if [[ -f "$extract_posix/windhawk.exe" ]] &&
               [[ -f "$extract_posix/windhawk.ini" ]] &&
               [[ -f "$extract_posix/Compiler/bin/clang++.exe" ]] &&
               [[ -n "$(find "$extract_posix/Engine" -name windhawk.lib -print -quit 2>/dev/null || true)" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Windhawk portable extraction did not complete"
            find "$extract_posix" -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          echo "Windhawk portable tree is ready"
      - name: Check metadata
        if: matrix.version == '2.0.0-alpha.8'
        run: |
          set -euo pipefail
          windhawk_path="${{ runner.temp }}\\windhawk"
          cli="$windhawk_path\\windhawk-cli.exe"
          while IFS= read -r file; do
            echo "Checking metadata of $file"
            MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" source meta --strict "$file" --json
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)
      - name: Compile bundles
        run: |
          set -euo pipefail
          windhawk_path="${{ runner.temp }}\\windhawk"
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            # Pin the upstream helper revision so the 1.x build stays
            # reproducible without vendoring the whole script.
            compiler_script="${{ runner.temp }}/compile_mod.py"
            compiler_script_url="https://raw.githubusercontent.com/ramensoftware/windhawk-mods/c121075aeb9dcc8e133423192cc9fdfb9e606ff5/scripts/compile_mod.py"
            curl --fail --location --retry 3 --retry-delay 1 "$compiler_script_url" -o "$compiler_script"
          else
            cli="$windhawk_path\\windhawk-cli.exe"
          fi

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            echo "Compiling $file"
            if [[ "$WINHAWK_VERSION" == 1.* ]]; then
              python -u "$compiler_script" -w "$windhawk_path" \
                -f "$file" \
                -o32 "${{ runner.temp }}/${name}_32.dll" \
                -o64 "${{ runner.temp }}/${name}_64.dll" \
                -oarm64 "${{ runner.temp }}/${name}_arm64.dll"
            else
              result="${{ runner.temp }}/${name}_compile.json"
              if ! MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" --json \
                mod install --disabled --arch all --file "$file" > "$result"; then
                jq -r '"::error::\(.error.code): \(.error.message)"' "$result" || cat "$result"
                exit 1
              fi
              if jq -e '(.data.warnings // []) | length > 0' "$result" > /dev/null; then
                cat "$result"
                echo "::error::$file compiled with warnings"
                exit 1
              fi
            fi
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)
      - name: Collect compiled DLLs
        run: |
          set -euo pipefail
          wh_root="${{ runner.temp }}/windhawk"
          out_dir="${{ runner.temp }}/dlls"
          mkdir -p "$out_dir"

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            for arch in 32 64 arm64; do
              if [[ "$WINHAWK_VERSION" == 1.* ]]; then
                src="${{ runner.temp }}/${name}_${arch}.dll"
              else
                mod_dir="$wh_root/AppData/Engine/Mods/$arch"
                candidates=()
                while IFS= read -r candidate; do
                  candidates+=("$candidate")
                done < <(find "$mod_dir" -maxdepth 1 -type f -name "local@${name}_*.dll" -print 2>/dev/null || true)
                if [[ "${#candidates[@]}" -ne 1 ]]; then
                  echo "::error::expected one $arch build for $name, found ${#candidates[@]}"
                  find "$mod_dir" -maxdepth 1 -type f -print 2>/dev/null || true
                  exit 1
                fi
                src="${candidates[0]}"
              fi
              if [[ ! -f "$src" ]]; then
                echo "::error::missing $arch build for $name at $src"
                exit 1
              fi
              cp "$src" "$out_dir/${name}_${arch}.dll"
            done
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

          find "$out_dir" -type f -print | sort
      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windhawk-${{ matrix.version }}-dlls
          path: ${{ runner.temp }}/dlls/*.dll
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish regenerated dist
    runs-on: ubuntu-latest
    needs: [bundle, compile]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bundle.outputs.regenerated == 'true'
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      published: ${{ steps.commit.outputs.published }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          # The publish gate compares main against the validated commit.
          fetch-depth: 0
      - name: Download bundled mods
        uses: actions/download-artifact@v8.0.2
        with:
          name: mod-bundles
          path: ${{ runner.temp }}/mod-bundles
      - name: Commit regenerated dist
        id: commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Everything below is relative to the commit that was bundled and
          # compiled. Keep it fixed across publish retries.
          validated="$(git rev-parse HEAD)"

          subject="$(git log -1 --pretty=%s)"
          issue="$(printf '%s' "$subject" | sed -nE 's/.*Issue-([0-9]+).*/#\1/p' | head -n 1)"
          if [ -z "$issue" ]; then
            issue="$(printf '%s' "$subject" | grep -oE '#[0-9]+' | head -n 1 || true)"
          fi
          short="$(git rev-parse --short=7 HEAD)"
          if [ -n "$issue" ]; then
            message="chore(dist): $issue regenerate mod bundles from $short"
          else
            message="chore(dist): regenerate mod bundles from $short"
          fi

          # main can advance while the compile matrix runs. A replay is safe
          # only while the newer commits leave every bundler input untouched,
          # so the artifact compiled here still describes those sources.
          published=false
          superseded=false
          reason=""
          sha=""

          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            remote="$(git rev-parse refs/remotes/origin/main)"

            if ! git merge-base --is-ancestor "$validated" "$remote"; then
              echo "::warning::main no longer descends from the validated commit"
              superseded=true
              reason="history"
              break
            fi
            if ! git diff --quiet "$validated" "$remote" -- \
              .gitattributes mods shared tools; then
              echo "::warning::main changed bundler inputs after this build started"
              superseded=true
              reason="sources"
              break
            fi

            # A direct dist commit after this build started describes content
            # this run never compiled. Only an exact match below may reuse it.
            dist_moved=false
            if ! git diff --quiet "$validated" "$remote" -- dist; then
              dist_moved=true
            fi

            # Rebuild the publish commit from the current tip. This discards a
            # previous local attempt, so a retry cannot publish an artifact
            # that no longer matches the commit it claims to describe.
            git reset --hard "$remote"
            rm -rf dist
            mkdir -p dist
            cp "$RUNNER_TEMP"/mod-bundles/*.wh.cpp dist/
            git add -- dist

            if git diff --cached --quiet; then
              # Another commit already carries exactly this validated dist.
              # Mark it published so the sync job can mirror that commit.
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "sha=$remote" >> "$GITHUB_OUTPUT"
              {
                echo "### Published dist"
                echo ""
                echo "main already carries the validated dist at \`$(git rev-parse --short=7 HEAD)\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$dist_moved" = "true" ]; then
              echo "::warning::main changed dist after this build started"
              superseded=true
              reason="dist"
              break
            fi
            git commit -m "$message"

            if git push origin HEAD:main; then
              published=true
              sha="$(git rev-parse HEAD)"
              break
            fi
            echo "publish attempt $attempt lost the push race, retrying"
            sleep $((attempt * 5))
          done

          if [ "$superseded" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            {
              echo "### Publish superseded"
              echo ""
              echo "main changed while this run compiled (cause: \`$reason\`)."
              echo "The newer validation run owns the dist publish and sync."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$published" != "true" ]; then
            echo "::error::could not publish the validated dist after 3 attempts"
            exit 1
          fi

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Published dist"
            echo ""
            echo "- commit: \`$(git rev-parse --short=7 HEAD)\`"
            echo "- message: $message"
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Sync to CYoJkoY/windhawk-mods
    runs-on: ubuntu-latest
    needs: [bundle, compile, publish]
    # Sync starts only after this run compiled the exact bundles it mirrors.
    # A push that leaves dist untouched never reaches the target repository.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bundle.result == 'success' &&
      needs.compile.result == 'success' &&
      (needs.bundle.outputs.regenerated == 'true' ||
       needs.bundle.outputs.dist_changed == 'true') &&
      (needs.publish.result == 'skipped' ||
       (needs.publish.result == 'success' &&
        needs.publish.outputs.published == 'true'))
    timeout-minutes: 15
    concurrency:
      group: sync-mods-to-windhawk-mods
      cancel-in-progress: false
    env:
      TARGET_REPO: CYoJkoY/windhawk-mods
      TARGET_BRANCH: main
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          # Sync exactly the published commit, not a main that moved meanwhile.
          ref: ${{ needs.publish.outputs.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify bundles are current
        run: python tools/bundle.py --check
      - name: Confirm main still has this dist
        id: fresh
        run: |
          set -euo pipefail

          # A queued sync may start after a newer push published its bundles.
          # Never overwrite the target with an outdated dist in that case.
          git fetch --no-tags --depth=1 origin main
          remote="$(git rev-parse FETCH_HEAD)"
          if ! git diff --quiet HEAD "$remote" -- dist; then
            {
              echo "### Sync gate"
              echo ""
              echo "- main now carries different bundles at \`$(git rev-parse --short=7 "$remote")\`."
              echo "- The newer validation run owns the sync job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Checkout target
        if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 1
          # Only mods/ is needed, so the thousands of upstream files stay out
          # of the checkout.
          sparse-checkout: |
            mods
          sparse-checkout-cone-mode: false
          token: ${{ secrets.SYNC_PAT }}
      - name: Sync dist bundles
        if: steps.fresh.outputs.current == 'true'
        uses: ./.github/actions/sync-dist
        with:
          source-root: ${{ github.workspace }}
          target-root: ${{ github.workspace }}/target
          target-branch: ${{ env.TARGET_BRANCH }}
          file-glob: '*.wh.cpp'
          prune: 'false'
          dry-run: 'false'
