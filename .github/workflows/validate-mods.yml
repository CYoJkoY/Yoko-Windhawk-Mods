name: Validate mods

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mods:
        description: 'Mod ids to publish, space or comma separated; empty publishes every mod'
        type: string
        default: ''
      open-prs:
        description: 'Open or refresh the upstream pull requests'
        type: boolean
        default: false
      dry-run:
        description: 'Report the pending branches without pushing them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  TARGET_REPO: CYoJkoY/windhawk-mods
  UPSTREAM_REPO: ramensoftware/windhawk-mods
  BRANCH_PREFIX: 'mods/'
  BASE_BRANCH: main
  WINHAWK_VERSIONS: '1.7.3 2.0.0-alpha.8'

jobs:
  bundle:
    name: Bundle and test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate mod bundles
        run: python tools/bundle.py

      - name: Run bundler tests
        run: python -m unittest discover -s tools/tests -t . -v

      - name: Report bundle statistics
        run: python tools/bundle.py --json

      - name: Upload bundled mods
        uses: actions/upload-artifact@v4
        with:
          name: mod-bundles
          path: dist/*.wh.cpp
          if-no-files-found: error
          retention-days: 14

  select:
    name: Select changed mods
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mods: ${{ steps.select.outputs.mods }}
      removed: ${{ steps.select.outputs.removed }}
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix || steps.fallback.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Map changed paths to mods
        id: select
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.mods || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$paths"
          extra=()
          requested="${REQUESTED//,/ }"
          if [ -n "${requested// /}" ]; then
            echo "Manual run; building only: $requested"
            read -r -a wanted <<< "$requested"
            extra=(--all --only "${wanted[@]}")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run; every mod is built."
            extra=(--all)
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request; every mod is compiled."
            extra=(--all)
          elif [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]] ||
            ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; every mod is built."
            extra=(--all)
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$paths"
            echo "Changed paths:"
            cat "$paths"
          fi
          python tools/changed_mods.py --paths "$paths" \
            --trigger shared \
            --trigger tools/bundle.py \
            --matrix \
            --github-output "$GITHUB_OUTPUT" \
            ${extra[@]+"${extra[@]}"}

      - name: Fallback matrix
        if: always() && steps.select.outcome != 'success'
        id: fallback
        run: echo 'matrix=["-"]' >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ matrix.mod }}
    runs-on: windows-latest
    needs: [bundle, select]
    if: |
      always() &&
      needs.bundle.result == 'success' &&
      needs.select.result == 'success' &&
      needs.select.outputs.count != '' &&
      needs.select.outputs.count != '0'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile ${{ matrix.mod }}
        id: compile
        uses: ./.github/actions/compile-mod
        with:
          mod-id: ${{ matrix.mod }}
          versions: ${{ env.WINHAWK_VERSIONS }}
          bundle: dist/${{ matrix.mod }}.wh.cpp
          dll-dir: ${{ runner.temp }}/dlls

      - name: Run native canvas regressions
        if: matrix.mod == 'aleph-canvas'
        env:
          WINDHAWK_ROOTS: ${{ steps.compile.outputs.windhawk-roots }}
        run: |
          set -euo pipefail
          while IFS='=' read -r version root; do
            if [ -z "${root:-}" ]; then
              continue
            fi
            echo "Native canvas regressions with Windhawk $version"
            WINDHAWK_ROOT="$root" python -m unittest tools.tests.test_aleph_canvas_native -v
          done <<< "$WINDHAWK_ROOTS"

      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windhawk-dlls-${{ matrix.mod }}
          path: ${{ runner.temp }}/dlls
          if-no-files-found: error
          retention-days: 14

      - name: Publish mod branches and pull requests
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-mod-branches
        with:
          bundle-dir: dist
          target-repo: ${{ env.TARGET_REPO }}
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          branch-prefix: ${{ env.BRANCH_PREFIX }}
          base-branch: ${{ env.BASE_BRANCH }}
          mods: ${{ matrix.mod }}
          open-prs: ${{ github.event_name != 'workflow_dispatch' || inputs.open-prs }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
          changelog: ${{ github.event.head_commit.message }}

  prune:
    name: Remove branches of deleted mods
    runs-on: ubuntu-latest
    needs: [select]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.select.outputs.removed != ''
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: publish-mod-branches
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # A deleted mod has no bundle, so this run only removes what is left of
      # it and never publishes anything.
      - name: Remove branches and pull requests
        uses: ./.github/actions/publish-mod-branches
        with:
          bundle-dir: ${{ runner.temp }}/mod-bundles
          target-repo: ${{ env.TARGET_REPO }}
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          token: ${{ secrets.SYNC_PAT }}
          branch-prefix: ${{ env.BRANCH_PREFIX }}
          base-branch: ${{ env.BASE_BRANCH }}
          publish: 'false'
          prune-mods: ${{ needs.select.outputs.removed }}
          open-prs: ${{ github.event_name != 'workflow_dispatch' || inputs.open-prs }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
          changelog: ${{ github.event.head_commit.message }}

  release:
    name: Deploy bundles to release branch
    runs-on: ubuntu-latest
    needs: [bundle, select, build]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bundle.result == 'success' &&
      needs.select.result == 'success' &&
      (needs.build.result == 'success' ||
        (needs.build.result == 'skipped' && needs.select.outputs.count == '0'))
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: ${{ runner.temp }}/mod-bundles

      - name: Publish release snapshot
        uses: ./.github/actions/publish-release
        with:
          bundle-dir: ${{ runner.temp }}/mod-bundles
          validated-sha: ${{ github.sha }}
          branch: release
