name: Validate mods

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'

jobs:
  bundle:
    name: Bundle and test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 不再依赖本地是否提交了 dist，统一由 bundler 在 Runner 中构建
      - name: Generate mod bundles
        run: python tools/bundle.py

      - name: Run bundler tests
        run: python -m unittest discover -s tools/tests -t . -v

      - name: Report bundle statistics
        run: python tools/bundle.py --json

      - name: Upload bundled mods
        uses: actions/upload-artifact@v4
        with:
          name: mod-bundles
          path: dist/*.wh.cpp
          if-no-files-found: error
          retention-days: 14

  compile:
    name: Compile with Windhawk ${{ matrix.version }}
    runs-on: windows-latest
    needs: bundle
    timeout-minutes: 45
    env:
      WINHAWK_VERSION: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.7.3'
          - '2.0.0-alpha.8'
    steps:
      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Windhawk
        run: |
          set -euo pipefail
          raw_version="${{ matrix.version }}"
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            installer_args=''
          else
            installer_args='/DEVTOOLS'
          fi

          installer_path="${RUNNER_TEMP}/windhawk_setup.exe"
          tag_with_v="v${raw_version#v}"
          tag_without_v="${raw_version#v}"

          # 自动兼容带或不带 'v' 的 GitHub Release Tag
          installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_with_v}/windhawk_setup.exe"
          echo "Downloading $installer_url"
          if ! curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path" 2>/dev/null; then
            installer_url="https://github.com/ramensoftware/windhawk/releases/download/${tag_without_v}/windhawk_setup.exe"
            echo "Retrying download with $installer_url"
            curl --fail --location --retry 3 --retry-delay 1 "$installer_url" -o "$installer_path"
          fi

          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          extract_win="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          echo "Extracting to $extract_win"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE $installer_args "/D=$extract_win"

          ready=0
          for _ in $(seq 1 150); do
            if [[ -f "$extract_posix/windhawk.exe" ]] &&
               [[ -f "$extract_posix/windhawk.ini" ]] &&
               [[ -f "$extract_posix/Compiler/bin/clang++.exe" ]] &&
               [[ -n "$(find "$extract_posix/Engine" -name windhawk.lib -print -quit 2>/dev/null || true)" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Windhawk portable extraction did not complete"
            find "$extract_posix" -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          echo "Windhawk portable tree is ready"

      - name: Check metadata
        if: startsWith(matrix.version, '2.')
        run: |
          set -euo pipefail
          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          windhawk_path="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          cli="$extract_posix/windhawk-cli.exe"
          while IFS= read -r file; do
            echo "Checking metadata of $file"
            MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" source meta --strict "$file" --json
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

      - name: Compile bundles
        run: |
          set -euo pipefail
          extract_posix="${RUNNER_TEMP//\\//}/windhawk"
          windhawk_path="$(cygpath -w "$extract_posix" 2>/dev/null || echo "$extract_posix")"
          if [[ "$WINHAWK_VERSION" == 1.* ]]; then
            compiler_script="${RUNNER_TEMP//\\//}/compile_mod.py"
            compiler_script_url="https://raw.githubusercontent.com/ramensoftware/windhawk-mods/c121075aeb9dcc8e133423192cc9fdfb9e606ff5/scripts/compile_mod.py"
            curl --fail --location --retry 3 --retry-delay 1 "$compiler_script_url" -o "$compiler_script"
          else
            cli="$extract_posix/windhawk-cli.exe"
          fi

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            echo "Compiling $file"
            if [[ "$WINHAWK_VERSION" == 1.* ]]; then
              python -u "$compiler_script" -w "$windhawk_path" \
                -f "$file" \
                -o32 "${RUNNER_TEMP//\\//}/${name}_32.dll" \
                -o64 "${RUNNER_TEMP//\\//}/${name}_64.dll" \
                -oarm64 "${RUNNER_TEMP//\\//}/${name}_arm64.dll"
            else
              result="${RUNNER_TEMP//\\//}/${name}_compile.json"
              if ! MSYS_NO_PATHCONV=1 "$cli" --app-root "$windhawk_path" --json \
                mod install --disabled --arch all --file "$file" > "$result"; then
                jq -r '"::error::\(.error.code): \(.error.message)"' "$result" || cat "$result"
                exit 1
              fi
              if jq -e '(.data.warnings // []) | length > 0' "$result" > /dev/null; then
                cat "$result"
                echo "::error::$file compiled with warnings"
                exit 1
              fi
            fi
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

      - name: Collect compiled DLLs
        run: |
          set -euo pipefail
          wh_root="${RUNNER_TEMP//\\//}/windhawk"
          out_dir="${RUNNER_TEMP//\\//}/dlls"
          mkdir -p "$out_dir"

          while IFS= read -r file; do
            name="$(basename "$file" .wh.cpp)"
            for arch in 32 64 arm64; do
              if [[ "$WINHAWK_VERSION" == 1.* ]]; then
                src="${RUNNER_TEMP//\\//}/${name}_${arch}.dll"
              else
                mod_dir="$wh_root/AppData/Engine/Mods/$arch"
                candidates=()
                while IFS= read -r candidate; do
                  candidates+=("$candidate")
                done < <(find "$mod_dir" -maxdepth 1 -type f -name "local@${name}_*.dll" -print 2>/dev/null || true)
                if [[ "${#candidates[@]}" -ne 1 ]]; then
                  echo "::error::expected one $arch build for $name, found ${#candidates[@]}"
                  find "$mod_dir" -maxdepth 1 -type f -print 2>/dev/null || true
                  exit 1
                fi
                src="${candidates[0]}"
              fi
              if [[ ! -f "$src" ]]; then
                echo "::error::missing $arch build for $name at $src"
                exit 1
              fi
              cp "$src" "$out_dir/${name}_${arch}.dll"
            done
          done < <(find dist -type f -name '*.wh.cpp' -print | sort)

          find "$out_dir" -type f -print | sort

      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windhawk-${{ matrix.version }}-dlls
          path: ${{ runner.temp }}/dlls/*.dll
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Deploy bundles to release branch
    runs-on: ubuntu-latest
    needs: [bundle, compile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mod-bundles
          path: ${{ runner.temp }}/mod-bundles

      - name: Deploy rebuilt bundles to release branch root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          orig_msg="$(git log -1 --pretty=%s)"
          short_sha="$(echo "${{ github.sha }}" | cut -c1-7)"

          # 1. 检出 release 分支（基于 FETCH_HEAD 避免单分支 shallow 模式下 origin/release 引用缺失）
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            git checkout -B release FETCH_HEAD
          else
            echo "Release branch not found. Initializing orphan branch."
            git checkout --orphan release
            git rm -rf . 2>/dev/null || true
          fi

          # 2. 写入 release 专有 .gitignore
          printf "*\n!*.wh.cpp\n!.gitignore\n" > .gitignore
          git add .gitignore

          # 3. 先清理旧的 *.wh.cpp，避免已删除的 mod 成为幽灵文件
          git rm -f *.wh.cpp 2>/dev/null || rm -f *.wh.cpp || true

          # 4. 覆盖当前构建出的所有 mod 文件并统一暂存
          cp -r "${{ runner.temp }}"/mod-bundles/*.wh.cpp .
          git add -A

          # 5. 若无实际变动则跳过
          if git diff --staged --quiet; then
            echo "Release branch root is already up to date, skipping commit."
            exit 0
          fi

          # 6. 提交并推送到 release 分支（带严格重试与状态校验）
          git commit -m "chore(release): $orig_msg ($short_sha)"
          pushed=0
          for i in 1 2 3; do
            if git push origin release; then
              echo "Successfully pushed to release branch."
              pushed=1
              break
            fi
            echo "Push failed, pulling and retrying ($i/3)..."
            git pull --rebase origin release || true
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push to release branch after 3 attempts."
            exit 1
          fi

  sync:
    name: Sync to CYoJkoY/windhawk-mods
    runs-on: ubuntu-latest
    needs: [publish]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success'
    timeout-minutes: 10
    concurrency:
      group: sync-mods-to-windhawk-mods
      cancel-in-progress: false
    env:
      TARGET_REPO: CYoJkoY/windhawk-mods
      TARGET_BRANCH: main
    steps:
      - name: Checkout action tooling
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/sync-dist/
          sparse-checkout-cone-mode: false

      - name: Checkout fresh release bundles
        uses: actions/checkout@v4
        with:
          ref: release
          path: source
          fetch-depth: 1

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 1
          sparse-checkout: |
            mods/
          sparse-checkout-cone-mode: false
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync dist bundles
        uses: ./.github/actions/sync-dist
        with:
          source-root: ${{ github.workspace }}/source
          target-root: ${{ github.workspace }}/target
          target-branch: ${{ env.TARGET_BRANCH }}
          file-glob: '*.wh.cpp'
          prune: 'false'
          dry-run: 'false'
