name: Mod compatibility check

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: '1'

jobs:
  run:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [
          '1.7.3',
          '2.0.0-alpha.5',
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Cache Windhawk
        id: cache-windhawk
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/windhawk
          key: v1-${{ runner.os }}-${{ matrix.version }}
      - name: Extract Windhawk
        if: steps.cache-windhawk.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ matrix.version }}" == 1.* ]]; then
            release_tag="v${{ matrix.version }}"
            installer_args=''
          else
            # Starting with 2.0.0-alpha.1, the release tag has no "v" prefix, and
            # the compiler is a separate component that /DEVTOOLS pulls into the
            # install.
            release_tag="${{ matrix.version }}"
            installer_args='/DEVTOOLS'
          fi

          installer_url="https://github.com/ramensoftware/windhawk/releases/download/$release_tag/windhawk_setup.exe"
          installer_path="${{ runner.temp }}/windhawk_setup.exe"
          echo "Downloading $installer_url to $installer_path"
          curl -L "$installer_url" -o "$installer_path"

          extract_path="${{ runner.temp }}\windhawk"
          echo "Extracting $installer_path to $extract_path"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE $installer_args "/D=$extract_path"
      - name: Get changed mod files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            mods/*.wh.cpp
      - name: Compile mod
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.all_changed_and_modified_files_count == '1' && ((steps.changed-files.outputs.added_files_count == '1') || (steps.changed-files.outputs.modified_files_count == '1'))
        env:
          ALL_CHANGED_AND_MODIFIED_FILES: ${{ steps.changed-files.outputs.all_changed_and_modified_files }}
        run: |
          echo "Compiling $ALL_CHANGED_AND_MODIFIED_FILES"
          windhawk_path="${{ runner.temp }}\windhawk"
          if [[ "${{ matrix.version }}" == 1.* ]]; then
            python -u scripts/compile_mod.py -w "$windhawk_path" \
              -f "$ALL_CHANGED_AND_MODIFIED_FILES" \
              -o32 "${{ runner.temp }}\mod_32.dll" \
              -o64 "${{ runner.temp }}\mod_64.dll" \
              -oarm64 "${{ runner.temp }}\mod_arm64.dll"
          else
            # Compile via the CLI (--disabled builds the mod without activating
            # it). --arch all builds the union of every machine scenario:
            # x86/x86-64 plus arm64, without the x86-64 build being skipped for a
            # mod whose targets are all common system processes.
            cli="$windhawk_path\windhawk-cli.exe"
            result="${{ runner.temp }}/compile_result.json"
            if ! MSYS_NO_PATHCONV=1 "$cli" --json \
              mod install --disabled --arch all --file "$ALL_CHANGED_AND_MODIFIED_FILES" \
              > "$result"; then
              # Compiler diagnostics are streamed to stderr, but the failure
              # summary goes to stdout in JSON mode, and a failure that produced
              # no diagnostics (bad metadata, for example) has no stderr output
              # at all.
              jq -r '"::error::\(.error.code): \(.error.message)"' "$result" \
                || cat "$result"
              exit 1
            fi

            # The CLI exits with 0 for a compile that only produced warnings, and
            # omits the "warnings" key when there were none. The warning text
            # itself is printed to stderr above.
            if jq -e '.data.warnings' "$result" > /dev/null; then
              echo "::error::The mod compiled with warnings"
              exit 1
            fi
          fi
