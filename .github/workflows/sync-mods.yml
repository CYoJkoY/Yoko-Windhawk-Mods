name: Sync mods -> CYoJkoY/windhawk-mods

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete mod files that exist in the target but not here"
        type: boolean
        default: false
      dry_run:
        description: "Print the file diff without pushing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-mods-to-windhawk-mods
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: CYoJkoY/windhawk-mods
      TARGET_BRANCH: main
      PRUNE: ${{ inputs.prune || github.event.inputs.prune || 'false' }}
      DRY_RUN: ${{ inputs.dry_run || github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout sync action
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/sync-dist/
          sparse-checkout-cone-mode: false

      - name: Checkout built mods from release branch
        uses: actions/checkout@v4
        with:
          ref: release
          path: source
          fetch-depth: 1

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 1
          sparse-checkout: |
            mods/
          sparse-checkout-cone-mode: false
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync dist bundles
        uses: ./.github/actions/sync-dist
        with:
          source-root: ${{ github.workspace }}/source
          target-root: ${{ github.workspace }}/target
          target-branch: ${{ env.TARGET_BRANCH }}
          file-glob: '*.wh.cpp'
          prune: ${{ env.PRUNE }}
          dry-run: ${{ env.DRY_RUN }}
