name: Sync mods -> CYoJkoY/windhawk-mods

# One-way mirror: dist/*.wh.cpp in this repository is copied to mods/ in
# CYoJkoY/windhawk-mods. Only this repository's workflow needs configuration.

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
  schedule:
    # Safety net in case a push event is missed. Runs at 03:17 UTC daily.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete mod files that exist in the target but not here"
        type: boolean
        default: false
      dry_run:
        description: "Print the file diff without pushing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-mods-to-windhawk-mods
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: CYoJkoY/windhawk-mods
      TARGET_BRANCH: main
      FILE_GLOB: "*.wh.cpp"
      PRUNE: ${{ github.event.inputs.prune || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout source (Yoko-Windhawk-Mods)
        uses: actions/checkout@v7.0.1
        with:
          path: source
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Checkout target (CYoJkoY/windhawk-mods)
        uses: actions/checkout@v7.0.1
        with:
          repository: CYoJkoY/windhawk-mods
          ref: main
          path: target
          fetch-depth: 1
          # Only mods/ is needed, so the thousands of upstream files stay out
          # of the checkout.
          sparse-checkout: |
            mods
          sparse-checkout-cone-mode: false
          token: ${{ secrets.SYNC_PAT }}

      - name: Verify bundles are current
        run: |
          set -euo pipefail
          cd source
          python tools/bundle.py --check

      - name: Mirror dist to target mods
        id: mirror
        run: |
          set -euo pipefail

          SRC_MODS="$GITHUB_WORKSPACE/source/dist"
          DST_MODS="$GITHUB_WORKSPACE/target/mods"
          GLOB="$FILE_GLOB"

          if [ ! -d "$SRC_MODS" ]; then
            echo "::error::source/dist not found, nothing to sync"
            exit 1
          fi
          mkdir -p "$DST_MODS"

          added=(); changed=(); removed=()

          # 1) Copy new and changed bundles.
          while IFS= read -r -d '' f; do
            rel="${f#"$SRC_MODS"/}"
            dst="$DST_MODS/$rel"
            mkdir -p "$(dirname "$dst")"
            if [ ! -f "$dst" ]; then
              cp "$f" "$dst"; added+=("$rel")
            elif ! cmp -s "$f" "$dst"; then
              cp "$f" "$dst"; changed+=("$rel")
            fi
          done < <(find "$SRC_MODS" -type f -name "$GLOB" -print0)

          # 2) Optionally remove files that no longer exist here.
          if [ "${PRUNE:-false}" = "true" ]; then
            while IFS= read -r -d '' f; do
              rel="${f#"$DST_MODS"/}"
              [ -f "$SRC_MODS/$rel" ] || { rm -f "$f"; removed+=("$rel"); }
            done < <(find "$DST_MODS" -type f -name "$GLOB" -print0)
          fi

          # 3) Commit message derives from the latest source commit.
          SRC_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse --short HEAD)"
          SRC_MSG="$(git -C "$GITHUB_WORKSPACE/source" log -1 --pretty=%s)"
          MSG="sync(mods): $SRC_MSG (Yoko@$SRC_SHA)"

          {
            echo "### Sync summary"
            echo ""
            echo "- target: \`$TARGET_REPO\` @ \`$TARGET_BRANCH\`"
            echo "- source commit: \`$SRC_SHA\` $SRC_MSG"
            echo "- added: ${#added[@]} / changed: ${#changed[@]} / removed: ${#removed[@]}"
            echo ""
            if [ ${#added[@]} -gt 0 ]; then
              for x in "${added[@]}";   do echo "- \`+\` $x"; done
            fi
            if [ ${#changed[@]} -gt 0 ]; then
              for x in "${changed[@]}"; do echo "- \`~\` $x"; done
            fi
            if [ ${#removed[@]} -gt 0 ]; then
              for x in "${removed[@]}"; do echo "- \`-\` $x"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry_run=true, skip push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd "$GITHUB_WORKSPACE/target"

          # Only mods/ is staged; every other file stays untouched.
          git add -A mods

          if git diff --cached --quiet; then
            echo "No mods changes, nothing to push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Push to target
        if: steps.mirror.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$TARGET_BRANCH" \
               && git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Pushed to $TARGET_REPO@$TARGET_BRANCH"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
